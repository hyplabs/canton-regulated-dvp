name: Daml

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Install DPM
        env:
          DPM_VERSION: 1.0.21
          DPM_SHA256: 71061e3ecee029bc88ccfc1b51367e3257162f3bd91c7edcc688af503fef5e59
        run: |
          curl --fail --location --silent --show-error \
            --output dpm.tar.gz \
            "https://github.com/digital-asset/dpm/releases/download/${DPM_VERSION}/dpm-${DPM_VERSION}-linux-amd64.tar.gz"
          echo "${DPM_SHA256}  dpm.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file dpm.tar.gz dpm
          mkdir --parents "$HOME/.local/bin"
          install --mode 0755 dpm "$HOME/.local/bin/dpm"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Daml SDK
        run: dpm install 3.5.2

      - name: Build and test
        run: ./scripts/test.sh
